name: mbrain
channels:
  - conda-forge
  - defaults
dependencies:
  - ipykernel
  - ipywidgets
  - jupyter
  - jupytext
  - matplotlib
  - nibabel
  - nilearn
  - notebook
  - numpy
  - pandas
  - pyarrow
  - pybids
  - pynrrd
  - pip
  - python=3.11
  # mrtrix3 is omitted from the conda environment definition because Conda/micromamba
  # does not reliably provide it on macOS (especially on Apple Silicon).
  # Run `mrinfo --version` to check if MRtrix3 is already installed.
  # If not, on macOS use the official standalone installer:
  #   sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/MRtrix3/macos-installer/master/install)"
  # On Linux, you can install mrtrix3 separately via your package manager or conda-forge,
  # or uncomment the line below if appropriate for your system:
  # - mrtrix3
  - scikit-learn
  - scipy
  - seaborn
  - setuptools
  - statsmodels
  - pip:
    - Glymur
    # antspyx is only needed for Option B (full pipeline from BIDS).
    # Skip it for Option A (paper figures from installed data):
    #   pip install antspyx
    - ImageIO
    - allensdk
    - argschema
    - blosc2
    - boto3
    - botocore
    - h5py
    - hdmf
    - lazy_loader
    - marshmallow
    - ndindex
    - ndx-events
    - numexpr
    - psycopg2-binary
    - py-cpuinfo
    - pynwb
    - requests-toolbelt
    - ruamel.yaml
    - ruamel.yaml.clib
    - scikit-build
    - semver
    - simpleitk
    - simplejson
    - tables
    - tifffile
    - xarray

