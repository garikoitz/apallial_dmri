# -----------------------------------------------------------------------------
# ATLAS ROI EXTRACTION (for CTRL subjects)
# -----------------------------------------------------------------------------
# CTRL subjects use Allen CCF atlas ROIs instead of manual ROIs.
# Script: python functions/atlas_roi_extraction.py --subject <subject_id>
#
# Process:
#   1. ANTs SyN registration of Allen template to subject T2w (~5 min)
#   2. Apply warp to annotation volume (NearestNeighbor interpolation)
#   3. Extract ROIs by collecting all child IDs under parent structure IDs
#   4. Split each ROI into left/right hemispheres
#
# CRITICAL L/R CONVENTION (flip1 space):
#   - Midline is along axis 2 (Z)
#   - Anatomical LEFT = HIGH Z voxel indices (keep [:, :, midline:])
#   - Anatomical RIGHT = LOW Z voxel indices (keep [:, :, :midline])
#
# Output structure:
#   {subject}/{session}/atlas/
#     ├── annotation_warped.nii.gz    # Warped Allen annotation
#     ├── atlas_coreg_0GenericAffine.mat   # ANTs affine transform
#     ├── atlas_coreg_1Warp.nii.gz    # ANTs warp field
#     └── rois/
#         ├── roi_isocortex.nii.gz        # Bilateral
#         ├── roi_isocortex_left.nii.gz   # Left hemisphere
#         ├── roi_isocortex_right.nii.gz  # Right hemisphere
#         └── ... (same for all ROIs)
# -----------------------------------------------------------------------------
atlas:
  # Reference to main rois section - see 'rois:' below for full Allen CCF ROI definitions
  # This section kept minimal for backward compatibility
  use_roi_definitions_from: "rois"

