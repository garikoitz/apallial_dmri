# -----------------------------------------------------------------------------
# GROUPWISE TEMPLATE CREATION (FLIP1 - UPDATED 2026-01-29)
# -----------------------------------------------------------------------------
# Templates are created per group (CTRL, AP, APTR) using flip1 pipeline subjects.
# For each group:
#   1. List all subject FOD images in a text file (one per line)
#   2. Run population_template with the list:
#        population_template <subjects.txt> <output_template.mif> -voxel_size 0.15 -force
#   3. Save all transforms and template images in: data/derivatives/mrtrix_preproc_flip1/templates/<GROUP>/
#
# Example (CTRL):
#   subjects_CTRL.txt:
#     sub-129-921-R1F/ses-260115121231/dwi/wm_fod_flip1.mif
#     sub-129-921-R1L1F/ses-260116085433/dwi/wm_fod_flip1.mif
#     sub-129-1014-L1M/ses-260115113814/dwi/wm_fod_flip1.mif
#     sub-138-1010-L1F/ses-260115101441/dwi/wm_fod_flip1.mif
#   population_template templates/CTRL/subjects_CTRL.txt templates/CTRL/wm_fod_template.mif -voxel_size 0.15 -force
#
# Random subject for ROI visualization (2026-01-29):
#   CTRL: sub-129-1014-L1M
#   AP:   sub-596-C-OO-NmM
#   APTR: sub-Apallial17NmF
#
# All template creation steps, subject lists, and transform files are tracked here for reproducibility.

# The correspondence in ROIs between manual ROIs and Allen ROIs is the following (left is manual ROIs, right is Allen ROIs):
# Graft:Isocortex
# Paleocortex:Piriform cortex + Entorhinal area + Piriform amygdalar area + Postpiriform transition area
# Striatum:Striatum dorsal region
# Thalamus:Thalamus
# Cerebellum:Cerebellum

# =============================================================================
# BIOLOGICAL AND METHODOLOGICAL DIFFERENCES BETWEEN GROUPS
# =============================================================================
# 
# This project studies three groups of mice with different cortical conditions:
#
# 1. CTRL (Control) - Wild-type mice with NORMAL cortex
#    - These mice have a fully developed, normal isocortex
#    - NO graft - they have never received any transplant
#    - ROI source: Allen CCF Atlas (automated extraction)
#    - Seed region: Isocortex (the normal cortex)
#    - Segmentation: Isocortex divided into 3 segments:
#        * anterior (front third)
#        * central (middle third)
#        * posterior (back third)
#    - Purpose: Establish baseline connectivity patterns in normal mice
#
# 2. AP (Apallial) - Mice with APALLIAL MUTATION, no transplant
#    - These mice have the Emx1-Cre;Lhx2loxP/loxP mutation
#    - This mutation causes absence/severe reduction of dorsal telencephalon (cortex)
#    - They develop an abnormal cortical region instead of normal isocortex
#    - NO transplant - they show the natural phenotype of the mutation
#    - ROI source: Manual segmentation (drawn by expert in 3D Slicer)
#    - Seed region: Graft (actually the abnormal cortical tissue, but called "Graft"
#                   for consistency with APTR naming)
#    - Segmentation: Graft divided into 6 segments (seg6) or 9 segments (seg9):
#        * seg6: anterior/central/posterior × dorsal/ventral = 6 segments
#        * seg9: anterior/central/posterior × dorsal/medial/ventral = 9 segments
#    - Purpose: Study connectivity in mutant mice without intervention
#
# 3. APTR (Apallial + Transplant) - Mice with mutation that RECEIVED cortical transplant
#    - Same Emx1-Cre;Lhx2loxP/loxP mutation as AP mice
#    - RECEIVED embryonic cortical tissue transplant to restore cortical function
#    - The transplanted tissue is called the "Graft"
#    - ROI source: Manual segmentation (drawn by expert in 3D Slicer)
#    - Seed region: Graft (the transplanted cortical tissue)
#    - Segmentation: Graft divided into 6 or 9 segments (same as AP)
#    - Purpose: Study if transplanted cortex establishes normal-like connectivity
#
# KEY METHODOLOGICAL DIFFERENCES:
# ===============================
# 
# | Aspect           | CTRL              | AP                | APTR              |
# |------------------|-------------------|-------------------|-------------------|
# | Cortex status    | Normal isocortex  | Abnormal/reduced  | Transplanted      |
# | ROI source       | Allen CCF Atlas   | Manual (Slicer)   | Manual (Slicer)   |
# | Seed ROI name    | Isocortex         | Graft             | Graft             |
# | Target ROIs      | Atlas-derived     | Manual-drawn      | Manual-drawn      |
# | Seed segments    | 3 (A/C/P only)    | 6 or 9            | 6 or 9            |
# | Pipeline         | flip1             | flip1             | flip1             |
#
# ROI CORRESPONDENCE (CTRL Atlas ↔ AP/APTR Manual):
# =================================================
# | CTRL (Atlas)       | AP/APTR (Manual)  | Description                        |
# |--------------------|-------------------|------------------------------------|
# | Isocortex          | Graft             | Cortical tissue (seed for tracts)  |
# | Striatum           | Striatum          | Target region                      |
# | Thalamus           | Thalamus          | Target region                      |
# | Piriform_Complex   | Paleocortex       | Olfactory cortex                   |
# | Cerebellum         | cerebellum        | Cerebellar region                  |
#
# =============================================================================

# MBRAIN Instructions
# 0. ALL GROUPS NOW USE FLIP1 PIPELINE ONLY (2026-01-29). The flip2 pipeline is OBSOLETE.
#    All processing happens in: derivatives/mrtrix_preproc_flip1/
#    We will NEVER mix different pipelines - all data for a subject must be in the same pipeline.
# 1. We always use matlab cleaning after we do tractography. Then we do sift2 to further select tracts. 
# 2. When visualizing, first we use the fibers that have been cleaned with matlab and then selected with sift2.
# 3. When visualizing we don't cd to the subject folder, we do it from the derivatives/mrtrix_preproc_flip1 folder.
# 4. AP and APTR group use manual ROIs for everything. CTRL use the roi coming from Allen atlas. 
# 5. We use this environment: micromamba activate mbrain
# 6. For matlab cleaning, we use the matlab specified in the config file.
# 7. We do not create new python or matlab scripts, we just edit the existing ones to make them more general and we pass them variables, such as subject and session name, tract to be processed, etc. So for example we do not create clean_dorsal_striatum.py, we just pass variables to clean_tracts.py and if cannot take the variable we edit it to make it more general every time. 
# 8. All the paths are specified in this config file. No hardcoded paths in the scripts.
# 9. For visualization, we use T2w_highres_flip.mif as background image by default
# 10. NEVER INTERRUPT RUNNING COMMANDS (2026-01-31):
#     When checking progress on a long-running command (like tckgen generating 1M streamlines),
#     NEVER run another command in the same terminal that would interrupt the process.
#     If you cannot check progress without interrupting, just tell the user you cannot check
#     and let the command continue running. Use get_terminal_output only, do NOT run new commands.
# 10b. ALWAYS USE PYTHON SCRIPTS, NEVER INLINE CODE (2026-02-12):
#     - NEVER use python -c "..." in the terminal — it breaks with quoting/multiline issues.
#     - Always write a proper .py file with docstring, then run it with `python path/to/script.py`.
#     - Temporary/diagnostic scripts go in utils/ (NOT /tmp), with a clear docstring.
#     - After running, ask the user if the script should be kept for future use.
#     - If kept, add it to the functions: section of this config. If not, delete it.
#     - All scripts must be documented with: purpose, usage example, and what it outputs.
