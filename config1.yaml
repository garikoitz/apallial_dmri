# 10c. MANUAL ROI LEFT/RIGHT SWAP FIX (2026-01-27):
#     PROBLEM: Original Slicer NRRD segmentations had LEFT and RIGHT labels SWAPPED.
#              When viewing ROIs on original T2w, the left-labeled ROI appeared on the 
#              anatomical RIGHT side, and vice versa.
#     OLD SOLUTION (legacy fallback): Created manual_roi_flip/ folders in mrtrix_preproc/
#              Files were copied with swapped names:
#                roi_{ROI}_left.nii.gz → roi_{ROI}_right.nii.gz (and vice versa)
#     CURRENT SOLUTION (2026-02-15): batch_process_flip1.py step3 now has automatic
#              L/R verification via _verify_roi_hemispheres(). After creating ROIs
#              from ANY source (Slicer or old pipeline), the function:
#                1. Converts each .mif to temp .nii.gz
#                2. Computes voxel centroid on axis 2 (L/R axis in flip1)
#                3. Checks: left ROI centroid k < midline, right k >= midline
#                4. If wrong, auto-swaps the file pair and re-verifies
#              This eliminates the need for hardcoded L/R swaps and prevents
#              the recurring L/R confusion regardless of the source data.
#     NEWMASK L/R FIX (2026-03-04): In mrtrix_newmask pipeline, 5 subjects had
#              swapped L/R labels. Fixed by renaming left<->right file pairs in:
#              manual_roi/, manual_roi/fod_space/, fod_space/shrink/,
#              graft_segments_fod/, graft_segments_fod/shrink/.
#              All stale L/R .tck tracks deleted (to be recalculated).
#              SWAPPED subjects: sub-596-C-OO-NmM, sub-769-C-OO-NmM,
#                sub-875-C-OO-NM, sub-AP72-862-901-NmF, sub-AP72-862-901-R1M
#              ALREADY CORRECT (not touched): sub-769-C-O5-R1M,
#                sub-Apallial17NmF, sub-Apallial20R1F
#              CTRL atlas ROIs verified correct (2026-03-04).
#     SUBJECTS WITH CORRECTED ROIS (manual_roi_flip folder):
#       - sub-Apallial17NmF/ses-240816091633/manual_roi_flip/ (validated)
#       - sub-596-C-OO-NmM/ses-240911103349/manual_roi_flip/
#       - sub-769-C-O5-R1M/ses-240911115733/manual_roi_flip/
#       - sub-769-C-OO-NmM/ses-240911111853/manual_roi_flip/
#       - sub-875-C-OO-NM/ses-240911100253/manual_roi_flip/
#       - sub-AP72-862-901-NmF/ses-251210093342/manual_roi_flip/
#       - sub-AP72-862-901-R1M/ses-251210100043/manual_roi_flip/
#       - sub-Apallial20R1F/ses-240909094232/manual_roi_flip/
#     ROIs: Graft, Striatum, Thalamus, Palecortex, cerebellum (left and right for each)
#     NOTE: For flip1 pipeline, use manual_roi_flip/ as source, NOT manual_roi/
#
# 10d. FLIP1 PIPELINE PROGRESS (CTRL GROUP - 2026-01-29):
#     ====================================================
#     CTRL subjects use preprocessed data from old pipeline (mrtrix_preproc).
#     The old pipeline already has flip1 transformation applied!
#     Unlike AP/APTR, CTRL uses Allen Atlas ROIs instead of manual ROIs.
#     
#     CRITICAL DISCOVERY (2026-01-29): The old pipeline (mrtrix_preproc) already
#     applied flip1 transformation (axes 2,1,0 + flip 1). The data is ALREADY
#     correctly preprocessed and coregistered to T2w. We just need to copy it
#     to the flip1 folder structure.
#     
#     CTRL SUBJECTS:
#       - sub-129-921-R1F/ses-260115121231
#       - sub-129-921-R1L1F/ses-260116085433
#       - sub-129-1014-L1M/ses-260115113814
#       - sub-138-1010-L1F/ses-260115101441
#
#     CTRL PREPROCESSING STEPS (UPDATED 2026-01-29):
#       [DONE] Step 1: Migrate preprocessed data from old pipeline
#              Script: /tmp/migrate_ctrl_to_flip1.sh
#              Files copied: dwi_preproc.mif, mask.mif, b0.mif, t2w_highres_flip.mif
#       [DONE] Step 2: Regenerate FOD using same method as AP/APTR
#              Script: /tmp/regenerate_ctrl_fod.sh
#              Method: dhollander (response) + msmt_csd (FOD) + mtnormalise (WM+CSF)
#              Files: response_{wm,gm,csf}.txt, {wm,gm,csf}_fod.mif, {wm,csf}_fod_norm.mif
#       [DONE] Step 3: Register Allen atlas to flip1 T2w
#              Script: python functions/atlas_roi_extraction.py --subject <subj>
#       [DONE] Step 4: Extract atlas ROIs (Isocortex, Striatum, Thalamus, etc.)
#       [DONE] Step 5: Split ROIs into left/right hemispheres (L/R convention validated)
#       [DONE] Step 6: Resample ROIs to FOD space
#              Script: python functions/resample_rois_to_fod.py --group CTRL --force
#       [    ] Step 7: Segment isocortex into 3 parts (anterior/central/posterior)
#       [    ] Step 8: Validate alignment with mrview
#       [    ] Step 9: Generate tractography
#
#     KEY DIFFERENCES FROM AP/APTR:
#       - ROI source: Allen Atlas (not manual segmentation)
#       - Seed region: Isocortex (not Graft)
#       - Segmentation: 3 segments only (A/C/P), NOT 6/9 (no dorsal/ventral split)
#
#     FILE NAMING IN FLIP1 PIPELINE (CONSISTENT ACROSS ALL GROUPS):
#       - dwi_preproc.mif = Preprocessed DWI (coregistered to T2w)
#       - response_{wm,gm,csf}.txt = Multi-tissue response functions (dhollander)
#       - {wm,gm,csf}_fod.mif = Multi-tissue FODs (msmt_csd)
#       - wm_fod_norm.mif = Normalized WM FOD for tractography
#       - csf_fod_norm.mif = Normalized CSF FOD
#       - mask.mif = Brain mask
#       - b0.mif = Mean b0 for visualization
#       - t2w_highres_flip.mif = T2w anatomical
#
# 11. Now everything needs to be in the new derivatives/mrtrix_preproc_flip1 pipeline, we can never combine two pipelines as the old pipeline will be deleted. 
# 12. All parameters need to be in this config file, no hardcoded parameters in the scripts. Always read from this config file and pass the parameters to the scripts.
# =============================================================================
# FLIP1 AXIS ORIENTATION (CRITICAL - DO NOT FORGET!)
# =============================================================================
# After flip1 transformation (axes 2,1,0 permutation + flip 1 ONLY, no flip 2):
#
#   AXIS 0 (shape[0]): ANTERIOR-POSTERIOR (A→P)
#     - HIGH index = anterior (nose)      *** OPPOSITE OF FLIP2! ***
#     - LOW index = posterior (back of brain)
#     - VERIFIED: Graft X=24.1 > Thalamus X=12.4 (Graft is anterior to Thalamus)
#     - Used for: anterior/central/posterior segmentation
#
#   AXIS 1 (shape[1]): DORSAL-VENTRAL (D→V)  
#     - Low index = dorsal (top of brain)
#     - High index = ventral (bottom of brain)
#     - Used for: dorsal/ventral segmentation
#
#   AXIS 2 (shape[2]): MEDIAL-LATERAL (LEFT-RIGHT)
#     - midline_z = shape[2] // 2
#
#     *** IMPORTANT: AFFINE HAS NEGATIVE Z DIRECTION (affine[2,2] < 0) ***
#     This means: High voxel Z index → LOW world Z coordinate (inverted!)
#
#     VOXEL INDEX vs WORLD COORDINATE:
#       - HIGH voxel Z index (>= midline) = LOW world Z coord = RIGHT hemisphere
#       - LOW voxel Z index (< midline) = HIGH world Z coord = LEFT hemisphere
#
#     HEMISPHERE SPLITTING (in voxel indices):
#       - LEFT mask: keep data[:, :, :midline_z], zero out data[:, :, midline_z:]
#       - RIGHT mask: keep data[:, :, midline_z:], zero out data[:, :, :midline_z]
#
# VALIDATED against AP manual ROIs (2026-03-04) using mrview volume render:
#   Convention confirmed: LOW voxel k (axis 2) = anatomical LEFT
#                         HIGH voxel k (axis 2) = anatomical RIGHT
#   Centroid check (sub-596-C-OO-NmM after fix):
#     Graft_left: low k → LEFT ✓, Graft_right: high k → RIGHT ✓
#
# VALIDATED for CTRL Allen atlas ROIs (2026-01-29):
#   Same convention applies to atlas-derived ROIs after warping to flip1 space.
#   Script: /tmp/mbrain_atlas/extract_rois.py uses this convention.
#
# IMPORTANT: Do NOT use axis 0 (X) for hemisphere splitting - that's A-P!
# =============================================================================
#
# 11. When visualizing tracts with mrview, first we do a tckinfo of the track so that on top of the T2w_highres_flip.mif we can see the tracts and then we load the corresponding roi to see where the tracts are going to.
# 12. if something files, do not try to automatically run things in the background or doing weird thing, as me for help knowing why is failing. 
# 13. Before doing tracking, check in at least one subject with mrview that everything is ok before launching the tracking for all subjects, you need to ask the user to check and when you get feedback that it is ok then you need to proceed. 
# 14. Before saying that something is there and you are skipping it, check that the date of the _cleaned.tck file is newer than the original .tck file, otherwise it means that the cleaning was not done and you need to do it.
# 
